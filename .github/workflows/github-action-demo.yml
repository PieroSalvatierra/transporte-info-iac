name: Transporte Info - GitHub Actions Demo

run-name: "${{ github.actor }} ejecuta un pipeline de transporte-info-iac"

on: [push]

jobs:
  Verificar-Proyecto:
    runs-on: ubuntu-latest

    steps:
      - name: Mostrar evento ejecutado
        run: echo "Este job se ha ejecutado por el evento ${{ github.event_name }}"

      - name: Mostrar rama y repositorio
        run: echo "La rama es ${{ github.ref }} y el repositorio es ${{ github.repository }}"

      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Mostrar archivos del proyecto
        run: |
          echo "Directorio de trabajo:"
          echo "${{ github.workspace }}"
          echo "Archivos y carpetas del proyecto:"
          ls -la "${{ github.workspace }}"

      - name: Mostrar estructura del proyecto
        run: |
          echo "Estructura de archivos:"
          find . -maxdepth 2 -type f -not -path './.git/*' | sort